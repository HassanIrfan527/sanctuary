# ─────────────────────────────────────────────────────────────
# Signal — kitty as an instrument panel. Catppuccin Mocha, spent the way
# DESIGN-BRIEF §2 spends it: grey structure, colour only for state.
#   green  = trace / live / "all is well"   (cursor, active tab, frame marks)
#   yellow = warn                           (nothing here yet; starship uses it)
#   red    = Master Caution                 (bell, a tab that needs you)
#
# Loaded through style.conf, a git-ignored symlink that shell.sh re-points
# when the Mod+Shift+T picker changes style (style-<word>.conf).
# The tab strip itself is drawn by tab_bar.py.
# ─────────────────────────────────────────────────────────────

# ── glass: crust, not base — but still glass (Harry: keep some, + blur) ──
background          #11111b
background_opacity  0.84
background_blur     12
foreground          #cdd6f4

# ── selection: a quiet surface, text keeps its own colour ──
selection_background  #313244
selection_foreground  none

# ── cursor: the trace colour, the one live thing on screen ──
cursor             #a6e3a1
cursor_text_color  #11111b

url_color  #b4befe
url_style  curly

# ── splits: hairline rules; the focused cell is marked in green ──
window_border_width    1px
draw_minimal_borders   yes
active_border_color    #a6e3a1
inactive_border_color  #313244
bell_border_color      #f38ba8

# ── the strip: always on, top edge, drawn by tab_bar.py ──
# Always visible (min_tabs 1) because it IS the window frame — the ┌ ┐ marks
# at its ends are Signal's registration marks. margin_width matches
# window_padding_width so ┌ sits over the first column of text.
tab_bar_edge           top
tab_bar_style          custom
tab_bar_align          left
tab_bar_min_tabs       1
tab_bar_margin_width   8
tab_bar_margin_height  6 2
tab_bar_background     none
tab_title_max_length   24
active_tab_foreground    #cdd6f4
active_tab_background    #11111b
inactive_tab_foreground  #6c7086
inactive_tab_background  #11111b

# ── marks (kitten marks / search highlights) ──
mark1_background  #a6e3a1
mark1_foreground  #11111b
mark2_background  #f9e2af
mark2_foreground  #11111b
mark3_background  #b4befe
mark3_foreground  #11111b

# ── the 16 colours: plain Mocha, so every TUI (yazi, btop, lazygit) is unchanged ──
# black
color0  #45475a
color8  #585b70
# red
color1  #f38ba8
color9  #f38ba8
# green
color2  #a6e3a1
color10 #a6e3a1
# yellow
color3  #f9e2af
color11 #f9e2af
# blue
color4  #89b4fa
color12 #89b4fa
# magenta
color5  #f5c2e7
color13 #f5c2e7
# cyan
color6  #94e2d5
color14 #94e2d5
# white
color7  #bac2de
color15 #a6adc8
