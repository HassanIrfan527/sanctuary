# ─────────────────────────────────────────────────────────────
# Lantern — kitty in the pixel style (night, docs/styles/lantern-harvest.md).
# Theme.qml's Lantern palette, spent the Lantern way:
#   pink  = you        (cursor, focused split, the tab strip's marks)
#   amber = light/time (links, yellow)      cyan = sound
#   green / orange / red = the machine
# Type: Cozette at 13px (the spec: "Cozette stays in the terminal"; Harry
# picked it 2026-10-16). 9.75pt = 13px at scale 1: whole pixels, nothing smeared.
# No blinking cursor: the pixel style has no motion.
#
# Loaded through style.conf (shell.sh re-points it: style-<word>.conf).
# tab_bar.py reads its colours from the options below, so it needs no copy.
# ─────────────────────────────────────────────────────────────

font_family      CozetteVector
bold_font        CozetteVectorBold
italic_font      CozetteVector
bold_italic_font CozetteVectorBold
font_size        9.75
disable_ligatures always

cursor_shape          block
cursor_blink_interval 0

# ── glass: the night's ink, still a little glass ──
background          #15122a
background_opacity  0.90
background_blur     12
foreground          #e8d6b4

# ── selection: raised paper, text keeps its own colour ──
selection_background  #2c2650
selection_foreground  none

# ── cursor: pink, it's you ──
cursor             #ff5c9d
cursor_text_color  #1e1216

url_color  #ffb347
url_style  straight

# ── splits: the focused one framed pink ──
window_border_width    2px
draw_minimal_borders   yes
active_border_color    #ff5c9d
inactive_border_color  #2c2650
bell_border_color      #e8423f

# ── the strip (drawn by tab_bar.py, same geometry as Signal) ──
tab_bar_edge           top
tab_bar_style          custom
tab_bar_align          left
tab_bar_min_tabs       1
tab_bar_margin_width   8
tab_bar_margin_height  6 2
tab_bar_background     none
tab_title_max_length   24
active_tab_foreground    #e8d6b4
active_tab_background    #15122a
inactive_tab_foreground  #9d8cb0
inactive_tab_background  #15122a

# ── marks ──
mark1_background  #ff5c9d
mark1_foreground  #1e1216
mark2_background  #ffb347
mark2_foreground  #1e1216
mark3_background  #5fd3e0
mark3_foreground  #1e1216

# ── the 16 colours ──
# black
color0  #2c2650
color8  #6e6288
# red
color1  #e8423f
color9  #ff8a7a
# green
color2  #7fc45a
color10 #b8e986
# yellow
color3  #ffb347
color11 #ffd68a
# blue
color4  #8fa3e8
color12 #b5c3ff
# magenta
color5  #ff5c9d
color13 #ffc2dc
# cyan
color6  #5fd3e0
color14 #9ff0f7
# white
color7  #f2dcb0
color15 #fff0cc
