# ─────────────────────────────────────────────────────────────
# Flare — Signal printed on daylight (2026-10-12). Same instrument panel as
# style-signal.conf, on Theme.qml's parchment palette: warm paper that reads
# white but isn't, deep indigo ink, accents dark enough for paper (>= 4:1).
#   ember   = trace / live      (cursor, active tab, frame marks) — Signal's green
#   ochre   = warn
#   crimson = Master Caution    (bell, a tab that needs you)
#
# Loaded through style.conf (shell.sh re-points it: style-<word>.conf).
# tab_bar.py reads its colours from the options below, so it needs no copy.
# ─────────────────────────────────────────────────────────────

# ── glass: base parchment, thicker than Signal's 0.84 — light over light washes out sooner ──
background          #f1e8cf
background_opacity  0.90
background_blur     12
foreground          #2b2838

# ── selection: a quiet surface, text keeps its own colour ──
selection_background  #d6c69c
selection_foreground  none

# ── cursor: the trace colour ──
cursor             #b04a06
cursor_text_color  #f1e8cf

url_color  #3f56a6
url_style  curly

# ── splits ──
window_border_width    1px
draw_minimal_borders   yes
active_border_color    #b04a06
inactive_border_color  #d6c69c
bell_border_color      #b0283c

# ── the strip (drawn by tab_bar.py, same geometry as Signal) ──
tab_bar_edge           top
tab_bar_style          custom
tab_bar_align          left
tab_bar_min_tabs       1
tab_bar_margin_width   8
tab_bar_margin_height  6 2
tab_bar_background     none
tab_title_max_length   24
active_tab_foreground    #2b2838
active_tab_background    #f1e8cf
inactive_tab_foreground  #857a62
inactive_tab_background  #f1e8cf

# ── marks ──
mark1_background  #b04a06
mark1_foreground  #f1e8cf
mark2_background  #8a6400
mark2_foreground  #f1e8cf
mark3_background  #3f56a6
mark3_foreground  #f1e8cf

# ── the 16 colours: a light-terminal layout (0 = dark ink, 7/15 = paper tones),
#    so TUIs that draw "black" text and "white" panels stay readable ──
# black
color0  #5c5445
color8  #857a62
# red
color1  #b0283c
color9  #c23a4d
# green
color2  #3d7a2a
color10 #4a8a33
# yellow
color3  #8a6400
color11 #a07600
# blue
color4  #3f56a6
color12 #4f68b8
# magenta
color5  #74489a
color13 #8656ac
# cyan
color6  #17706a
color14 #208a82
# white
color7  #c6b48a
color15 #d6c69c
