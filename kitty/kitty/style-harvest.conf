# ─────────────────────────────────────────────────────────────
# Harvest — kitty in the pixel style (day, docs/styles/lantern-harvest.md).
# Theme.qml's Harvest palette, spent the Lantern way:
#   pink  = you        (cursor, focused split, the tab strip's marks)
#   amber = light/time (links, yellow)      cyan = sound
#   green / orange / red = the machine
# Type: Cozette at 13px (the spec: "Cozette stays in the terminal"; Harry
# picked it 2026-10-16). 9.75pt = 13px at scale 1: whole pixels, nothing smeared.
# No blinking cursor: the pixel style has no motion.
#
# Loaded through style.conf (shell.sh re-points it: style-<word>.conf).
# tab_bar.py reads its colours from the options below, so it needs no copy.
# ─────────────────────────────────────────────────────────────

font_family      CozetteVector
bold_font        CozetteVectorBold
italic_font      CozetteVector
bold_italic_font CozetteVectorBold
font_size        9.75
disable_ligatures always

cursor_shape          block
cursor_blink_interval 0

# ── glass: paper, a little thicker than at night (light over light washes out) ──
background          #f6e2b3
background_opacity  0.92
background_blur     12
foreground          #4a2a1e

# ── selection: raised paper, text keeps its own colour ──
selection_background  #fff0cc
selection_foreground  none

# ── cursor: pink, it's you ──
cursor             #b8286c
cursor_text_color  #fff0cc

url_color  #a8561a
url_style  straight

# ── splits: the focused one framed pink ──
window_border_width    2px
draw_minimal_borders   yes
active_border_color    #b8286c
inactive_border_color  #d9b77c
bell_border_color      #a82418

# ── the strip (drawn by tab_bar.py, same geometry as Signal) ──
tab_bar_edge           top
tab_bar_style          custom
tab_bar_align          left
tab_bar_min_tabs       1
tab_bar_margin_width   8
tab_bar_margin_height  6 2
tab_bar_background     none
tab_title_max_length   24
active_tab_foreground    #4a2a1e
active_tab_background    #f6e2b3
inactive_tab_foreground  #8a5a3a
inactive_tab_background  #f6e2b3

# ── marks ──
mark1_background  #b8286c
mark1_foreground  #fff0cc
mark2_background  #a8561a
mark2_foreground  #fff0cc
mark3_background  #2f6fa0
mark3_foreground  #fff0cc

# ── the 16 colours ──
# a light-terminal layout (0 = dark ink, 7/15 = paper tones), as in Flare,
#   so TUIs that draw "black" text and "white" panels stay readable
# black
color0  #5a3a2a
color8  #8a5a3a
# red
color1  #a82418
color9  #c43a2c
# green
color2  #3f8a2e
color10 #4f9a3a
# yellow
color3  #a8561a
color11 #c56a1a
# blue
color4  #3a5a9a
color12 #4a6aaa
# magenta
color5  #b8286c
color13 #c8407e
# cyan
color6  #1f7a80
color14 #2a8f95
# white
color7  #d9b77c
color15 #e8c890
