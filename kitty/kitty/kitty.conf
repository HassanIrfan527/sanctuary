# Kitty Configuration
# ==================

# Include active theme colors (swapped by switch-theme.sh)
include current-theme.conf

# Window Layout
remember_window_size no
initial_window_width  110c
initial_window_height 39c
placement_strategy center
hide_window_decorations yes
window_padding_width 8

# Fonts
# DM Mono has no Bold weight — Medium stands in.
font_family      DM Mono
bold_font        DM Mono Medium
italic_font      DM Mono Italic
bold_italic_font DM Mono Medium Italic
font_size 12.0
disable_ligatures never

# DM Mono ships zero icon glyphs, so every Nerd Font range goes to JetBrains:
# powerline, devicons, font awesome, octicons, codicons, material (U+F0001+).
symbol_map U+23FB-U+23FE,U+2665,U+26A1,U+2B58,U+E000-U+E00A,U+E0A0-U+E0A3,U+E0B0-U+E0D4,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B7,U+E700-U+E8EF,U+EA60-U+EC1E,U+ED00-U+EFCE,U+F000-U+F2FF,U+F300-U+F381,U+F400-U+F533,U+F0001-U+F1AF0 JetBrainsMono Nerd Font Mono

# Transparency
# background_opacity is set per-theme in current-theme.conf (cream needs to be more solid than Mocha)
background_blur 4
dynamic_background_opacity yes

# Cursor
cursor_shape block
cursor_blink_interval 0
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# Performance
sync_to_monitor yes
repaint_delay 10
input_delay 3
touch_scroll_multiplier 1.0

# Shell Integration
shell_integration enabled

# Window Management
window_resize_step_cells 2
window_resize_step_lines 2
confirm_os_window_close -1

# Tab Bar
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted

# Keyboard Shortcuts
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0
map ctrl+shift+a>m set_background_opacity +0.05
map ctrl+shift+a>l set_background_opacity -0.05
map ctrl+shift+a>d set_background_opacity default

# Misc
allow_remote_control yes
update_check_interval 0
enable_audio_bell no
visual_bell_duration 0.0
url_style curly
copy_on_select no
strip_trailing_spaces smart
