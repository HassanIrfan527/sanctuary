# The Sanctuary — fuzzel
# Direction: TUI-native. Square, 1px muted border, monospace, no icons.
# Read ~/.dotfiles/DESIGN-BRIEF.md before changing colours or shapes.
#
# It is one island in the same language as the bar: crust fill, muted lavender
# border, bracketed prompt. It reads as a bar module that grew a list.
#
# Bound to Mod+Space.

# 13px, not 12. The bar is glanced at; this is read while tired, and it is the
# only surface where a point of extra size costs nothing.
font=JetBrainsMono Nerd Font:size=13
dpi-aware=no
use-bold=no
terminal=kitty -e

# Brackets match [ mic on ] and [ 15:08 Tue 22 ] on the bar.
prompt=[ run ] 
placeholder=filter
match-counter=yes

# No icons: app icons are full-colour artwork and cannot be restyled, the same
# problem the tray has (DESIGN-BRIEF §7).
icons-enabled=no

# Desktop entries only. Adding every binary in PATH pushed the list past 1400
# entries and diluted the fuzzy match — the launcher stopped being one keypress.
list-executables-in-path=no

# fzf-style substring matching over the fields that actually identify an app.
# `comment` and `categories` are left out on purpose: they match far too
# loosely and push the thing you meant down the list.
match-mode=fzf
fields=name,generic,keywords
show-actions=yes
sort-result=yes

layer=overlay
anchor=center
lines=11
width=46
line-height=22
horizontal-pad=18
vertical-pad=14
inner-pad=10
exit-on-keyboard-focus-loss=yes

[colors]
# crust fill, muted-lavender border. Selection is a filled @surface0 row, not a
# coloured highlight — the block of fill is the indicator, same idea as █ in the
# workspace module. It has to survive being read by someone exhausted, so it is
# a step brighter than the surrounding fill rather than a whisper above it.
#
# Matched characters take mauve, the workspace accent, so the thing the search
# actually caught is the brightest thing on screen.
background=11111bf7
text=a6adc8ff
prompt=b4befeff
placeholder=45475aff
input=cdd6f4ff
match=cba6f7ff
selection=313244ff
selection-text=cdd6f4ff
selection-match=cba6f7ff
counter=45475aff
border=8b92b8ff

[border]
radius=0
width=1

[key-bindings]
# Control+k is delete-line-forward by default; hand it to vim movement instead.
delete-line-forward=none
next=Control+j Control+n Down
prev=Control+k Control+p Up
