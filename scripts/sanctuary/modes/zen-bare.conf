# Zen, no bar — nothing but windows. Mod+Shift+A still peeks the clock bar back
# in (bar.sh falls back to the zen bar when the mode asks for none), so losing
# the time is never a mode switch away.
ORDER=30
LABEL="Zen — no bar"
DESC="12px radius · wide gaps · no bar"

GAPS=16
STRUT_SIDE=40
STRUT_TOP=40           # no bar to take the top space, so the strut takes it
STRUT_BOTTOM=40
DEFAULT_WIDTH=0.5
BORDER=2
RADIUS=12
WINDOW_OPACITY=0.97   # just enough for the blur to register behind a window
CENTER_SINGLE=yes

BAR=none
BAR_BLUR=yes              # the pill is sheer, so there is something to blur
DND=off                # 2026-09-27: notifications stay ON in zen — Harry works in
                       # this mode and wants them. Quiet comes from the cozy theme,
                       # not from silence. Mod+Alt+D still toggles DND by hand.
SWAYNC=cozy                # rounded, soft, artwork on (swaync/swaync/themes/cozy)
