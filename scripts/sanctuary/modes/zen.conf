# Zen — one thing at a time. Space instead of information, and the clock is the
# only module left because §1 says it is the one thing read without looking for it.
#
# RADIUS=12 is the one deliberate departure from DESIGN-BRIEF §2 (square, 0-2px).
# It is scoped to this mode, and the cost is real: with clip-to-geometry true, a
# radius this large nibbles the corner *character cell* of a bordered TUI.
ORDER=20
LABEL="Zen"
DESC="12px radius · wide gaps · clock only · dnd"

GAPS=16
STRUT_SIDE=40
STRUT_TOP=20           # the bar's own exclusive zone sits on top of this
STRUT_BOTTOM=32
DEFAULT_WIDTH=0.5
BORDER=2
RADIUS=12
WINDOW_OPACITY=0.97   # just enough for the blur to register behind a window
CENTER_SINGLE=yes      # a lone window sits centred instead of hugging the left edge

BAR=zen
BAR_BLUR=yes              # the pill is sheer, so there is something to blur
DND=on
