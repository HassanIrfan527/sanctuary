<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Jersey 10 / Jersey 15 (the Lantern / Harvest type, OFL) are pixel fonts:
  smoothed, they blur. Draw them as hard pixels wherever fontconfig decides —
  Vesktop (Chromium), GTK / Pango. Quickshell does the same
  itself (kits/lantern/LText.qml). Only these two families are touched.
-->
<fontconfig>
  <match target="font">
    <test name="family" compare="eq"><string>Jersey 15</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
  </match>
  <match target="font">
    <test name="family" compare="eq"><string>Jersey 10</string></test>
    <edit name="antialias" mode="assign"><bool>false</bool></edit>
    <edit name="hinting" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
