[mgr]
ratio          = [1, 4, 3]
sort_by        = "natural"
sort_sensitive = false
sort_reverse   = false
sort_dir_first = true
linemode       = "size"
show_hidden    = false
show_symlink   = true
scrolloff      = 5

[preview]
tab_size    = 2
max_width   = 600
max_height  = 900
image_delay = 30

[opener]
edit = [
  { run = 'nvim "$@"', block = true, for = "unix" },
]
open = [
  { run = 'xdg-open "$@"', desc = "Open", orphan = true, for = "unix" },
]
reveal = [
  { run = 'nautilus "$@"', orphan = true, desc = "Reveal in Nautilus", for = "unix" },
]

[open]
rules = [
  { name = "*/", use = [ "edit", "open", "reveal" ] },

  { mime = "text/*",  use = [ "edit", "reveal" ] },
  { mime = "image/*", use = [ "open", "reveal" ] },
  { mime = "video/*", use = [ "open", "reveal" ] },
  { mime = "audio/*", use = [ "open", "reveal" ] },

  { mime = "application/{,g}zip",                            use = [ "open", "reveal" ] },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", use = [ "open", "reveal" ] },
  { mime = "application/pdf",                                use = [ "open", "reveal" ] },

  { mime = "*", use = [ "open", "edit", "reveal" ] },
]
