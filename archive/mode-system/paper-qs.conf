# Paper — the manga style printed light: Latte panels in black ink, hard offset
# shadows, a tilted screentoned clock, toasts as speech bubbles (critical ones
# shout). Windows get the same treatment: a light ink-coloured border and a
# solid offset shadow, so every window is a panel on the page.
#
# THE ONE WORD is BAR=. `paper` → this look. Change it to `ink` for the dark
# printing, `signal` for Signal, or `full` for waybar + swaync. See mode.sh.
ORDER=45
LABEL="Paper — QS"
DESC="paper manga panels · hard shadows · bubbles"

GAPS=14                # room for each window's shadow to land between columns
STRUT_SIDE=16
STRUT_TOP=6            # the bar's own exclusive zone sits on top of this
STRUT_BOTTOM=18
DEFAULT_WIDTH=0.5
BORDER=3               # ink weight — same 3px as the bar's panel outlines
RADIUS=0               # panels are cut, not rounded
WINDOW_OPACITY=1.0     # paper is opaque
CENTER_SINGLE=no

BORDER_ACTIVE="#cdd6f4"    # the focused window is outlined in "ink" (light on a dark desk)
BORDER_INACTIVE="#45475a"
SHADOW=on
SHADOW_SOFTNESS=0      # 0 = a hard block, not a glow — the whole look
SHADOW_X=7
SHADOW_Y=7
SHADOW_COLOR="#cba6f7"     # focused: mauve, like the workspaces panel
SHADOW_INACTIVE="#11111b"  # unfocused: a plain dark block

BAR=paper
BAR_BLUR=no            # Quickshell's panels are solid; nothing to blur
DND=off
SWAYNC=ascii           # unused while Quickshell owns notifications; kept for BAR=full
