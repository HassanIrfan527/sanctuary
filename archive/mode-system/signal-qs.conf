# Signal — the instrument panel, drawn by Quickshell. One hairline strip with
# registration marks, live traces for net / cpu / mem, mic gain as cells, and
# notifications as log entries with a draining time rule. Windows match: square,
# 1px, the focused one outlined in the trace green.
#
# THE ONE WORD is BAR=. `signal` → this look. Change it to `ink` and this mode
# draws Ink; to `full` and it is back on waybar + swaync. See mode.sh.
ORDER=50
LABEL="Signal — QS"
DESC="instrument strip · live traces · log toasts"

GAPS=6
STRUT_SIDE=8
STRUT_TOP=4            # the bar's own exclusive zone sits on top of this
STRUT_BOTTOM=8
DEFAULT_WIDTH=0.5
BORDER=2               # was 1; a hair heavier than the strip rules so windows read as the subject
RADIUS=0
WINDOW_OPACITY=1.0
CENTER_SINGLE=no

BORDER_ACTIVE="#a6e3a1"    # the trace colour: the focused window is "the reading"
BORDER_INACTIVE="#313244"
SHADOW=off

BAR=signal
BAR_BLUR=no
DND=off
SWAYNC=ascii           # unused while Quickshell owns notifications; kept for BAR=full
