# ── Keybinds ──────────────────────────────────────────────────────────
# The niri binds (niri/niri/binds.kdl), ported 2026-10-12. Same key, same job
# wherever Mango has the action; the differences were talked through one by
# one and are marked "≠ niri" below.
#
# RULE: the KEYS cheat sheet (Mod+/) is HAND-WRITTEN in
# quickshell/sanctuary/Keymap.qml. Any change here updates Keymap.qml in the
# same edit — rows tagged "mango" there are the ones that differ from niri.
#
# Syntax: bind=MODIFIERS,key,action[,argument…]
#   spawn       runs one command (quotes, ~ and $VARS work; no pipes)
#   spawn_shell runs it through sh (pipes, ;, $(…))
#   bindl       also works on the lock screen
# Arguments are split on commas, so no command here may contain one.

# ── launch apps ──
bind=SUPER,Return,spawn,kitty
bind=SUPER,e,spawn,kitty -e yazi
bind=SUPER,y,spawn,nautilus
bind=SUPER,b,spawn,brave-browser

# ── launcher ──  Quickshell's, in the current style; launcher.sh falls back
# to fsel in a floating kitty when Quickshell is down.
bind=SUPER,space,spawn,~/.dotfiles/scripts/sanctuary/launcher.sh
bind=SUPER+SHIFT,space,spawn,fuzzel --config=$HOME/.dotfiles/fuzzel/fuzzel/fuzzel.ini

# ── notifications ──  Quickshell or swaync, whichever runs (notif.sh)
bind=SUPER+SHIFT,d,spawn,~/.dotfiles/scripts/sanctuary/notif.sh centre
bind=SUPER+CTRL,d,spawn,~/.dotfiles/scripts/sanctuary/notif.sh clear
bind=SUPER+ALT,d,spawn,~/.dotfiles/scripts/sanctuary/notif.sh dnd

# ── panels ──  TUIs in floating kittys (rules.conf floats them by class),
# and Quickshell cards.
bind=SUPER,v,spawn,kitty --class sanctuary-clipboard -e ~/.dotfiles/scripts/sanctuary/clipboard.sh
bind=SUPER+ALT,m,spawn,kitty --class sanctuary-mixer -e wiremix
bind=SUPER,o,spawn,~/.dotfiles/scripts/sanctuary/patch.sh
bind=SUPER+SHIFT,w,spawn,~/.dotfiles/scripts/sanctuary/wallpaper.sh open
bind=SUPER+SHIFT,t,spawn,~/.dotfiles/scripts/sanctuary/shell.sh pick
bind=SUPER+SHIFT,a,spawn,~/.dotfiles/scripts/sanctuary/bar.sh
bind=SUPER,slash,spawn,~/.dotfiles/scripts/sanctuary/keys.sh
bind=SUPER,c,spawn,~/.dotfiles/scripts/sanctuary/comms.sh
bind=SUPER,u,spawn,~/.dotfiles/scripts/sanctuary/qs.sh call rig toggle
# The column strip: what SUPER+1..9 points at on this tag.
bind=SUPER,grave,spawn,~/.dotfiles/scripts/sanctuary/columns.sh peek

# ── audio ──  wpctl talks to PipeWire directly; the bar is the readout.
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ -l 1.0
bind=SUPER,equal,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+ -l 1.0
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=SUPER,minus,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=SUPER,0,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bind=SUPER,m,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bind=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# ── media ──
bind=SUPER+SHIFT,m,spawn,playerctl play-pause
bind=SUPER+SHIFT,bracketright,spawn,playerctl next
bind=SUPER+SHIFT,bracketleft,spawn,playerctl previous

# ── recorders ──  meeting = two mono WAVs (me / them); practice = mic only.
bind=SUPER+SHIFT,r,spawn,~/.dotfiles/scripts/sanctuary/meeting-rec.sh toggle
bind=SUPER+ALT,r,spawn,~/.dotfiles/scripts/sanctuary/meeting-rec.sh toggle --solo
bind=CTRL,Print,spawn,~/.dotfiles/scripts/sanctuary/screenrec.sh key
bind=CTRL+ALT,Print,spawn,~/.dotfiles/scripts/sanctuary/screenrec.sh pause-toggle

# ── screenshots ──
bind=NONE,Print,spawn,~/.dotfiles/scripts/screenshot.sh
bind=SHIFT,Print,spawn_shell,grim -g "$(slurp)" - | swappy -f -

# ── night light ──  warmer = more filter; clamped 1500–6500 K
bind=SUPER+CTRL,minus,spawn,~/.dotfiles/scripts/sanctuary/nightlight.sh warmer
bind=SUPER+CTRL,equal,spawn,~/.dotfiles/scripts/sanctuary/nightlight.sh cooler
bind=SUPER+CTRL,0,spawn,~/.dotfiles/scripts/sanctuary/nightlight.sh reset

# ── keysounds ──
bind=SUPER+SHIFT,s,spawn,kitty --class keysound-launcher -e ~/.dotfiles/scripts/keysounds.sh choose
bind=SUPER+ALT,s,spawn,~/.dotfiles/scripts/keysounds.sh toggle

# ── overview ──  every tag's windows in a grid; click or move to pick.
bind=SUPER,Tab,toggleoverview
# ≠ niri (Mango only): every window gets a letter — type it to go there.
bind=SUPER,period,togglejump

# ── windows ──
bind=SUPER,w,killclient
# ≠ niri: niri widens the column; Mango fills the screen (bar kept) and the
# window sits above the strip until pressed again.
bind=SUPER,f,togglemaximizescreen
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER+SHIFT,v,togglefloating
bind=SUPER+ALT,c,centerwin
# ≠ niri (Mango only): pin to every tag (a video, a player). niri's SUPER+G
# (tabbed column) has no Mango twin and was dropped.
bind=SUPER,g,toggleglobal
# ≠ niri (Mango only): back to the window you were just in, and again to return.
bind=SUPER,BackSpace,focuslast
# ≠ niri (Mango only): thumbnail switcher over this tag's windows. Hold Alt,
# tap Tab; letting go picks.
bind=ALT,Tab,switcher,next
bind=ALT+SHIFT,Tab,switcher,prev

# ── focus (vim) ──  H/L = columns, J/K = up/down a stacked column
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up

# ── move window ──  swap with the neighbour that way
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,l,exchange_client,right
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up

# ── stacks ──  niri's consume-or-expel: H/L pull the window into the
# neighbouring column's stack, or push it back out. J/K shift it within.
bind=SUPER+CTRL,h,scroller_stack,left
bind=SUPER+CTRL,l,scroller_stack,right
bind=SUPER+CTRL,j,exchange_client,down
bind=SUPER+CTRL,k,exchange_client,up

# ── resize ──  presets ⅓ ½ ⅔ (layout.conf). resizewin is in pixels:
# 192 × 108 is 10% of this 1920×1080 screen, matching niri's ±10%.
bind=SUPER,r,switch_proportion_preset
bind=SUPER+ALT,h,resizewin,-192,0
bind=SUPER+ALT,l,resizewin,+192,0
bind=SUPER+ALT,k,resizewin,0,-108
bind=SUPER+ALT,j,resizewin,0,+108

# ── layouts ──  per tag: only the tag you are looking at changes.
# ALT cycles scroller → tile → grid → monocle → deck blind (the bar names it);
# CTRL opens the picker with all 14 (quickshell/sanctuary/LayoutPicker.qml).
bind=SUPER+ALT,space,switch_layout
bind=SUPER+CTRL,space,spawn,~/.dotfiles/scripts/sanctuary/qs.sh call layouts toggle

# ── columns by index ──  SUPER+N focuses the Nth column on this tag, as on
# niri. Mango has no such action; wm.sh counts the columns left to right.
bind=SUPER,1,spawn,~/.dotfiles/scripts/sanctuary/wm.sh focus-column 1
bind=SUPER,2,spawn,~/.dotfiles/scripts/sanctuary/wm.sh focus-column 2
bind=SUPER,3,spawn,~/.dotfiles/scripts/sanctuary/wm.sh focus-column 3
bind=SUPER,4,spawn,~/.dotfiles/scripts/sanctuary/wm.sh focus-column 4
bind=SUPER,5,spawn,~/.dotfiles/scripts/sanctuary/wm.sh focus-column 5
bind=SUPER,6,spawn,~/.dotfiles/scripts/sanctuary/wm.sh focus-column 6
bind=SUPER,7,spawn,~/.dotfiles/scripts/sanctuary/wm.sh focus-column 7
bind=SUPER,8,spawn,~/.dotfiles/scripts/sanctuary/wm.sh focus-column 8
bind=SUPER,9,spawn,~/.dotfiles/scripts/sanctuary/wm.sh focus-column 9

# ── send to tag ──  ≠ niri (there: move column to position N). The window
# goes to tag N and you go with it.
bind=SUPER+SHIFT,1,tag,1
bind=SUPER+SHIFT,2,tag,2
bind=SUPER+SHIFT,3,tag,3
bind=SUPER+SHIFT,4,tag,4
bind=SUPER+SHIFT,5,tag,5
bind=SUPER+SHIFT,6,tag,6
bind=SUPER+SHIFT,7,tag,7
bind=SUPER+SHIFT,8,tag,8
bind=SUPER+SHIFT,9,tag,9

# ── tags ──  prev / next through all nine, empty ones too (the bar's WS
# scroll does the same). SHIFT takes the window along.
bind=SUPER,p,viewtoleft
bind=SUPER,n,viewtoright
bind=SUPER+SHIFT,p,tagtoleft
bind=SUPER+SHIFT,n,tagtoright

# ── mouse ──
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
# SUPER+wheel anywhere = the bar's WS-cell wheel: tags, and with SHIFT the
# windows of this tag (up = left; stops at the ends).
axisbind=SUPER,UP,viewtoleft
axisbind=SUPER,DOWN,viewtoright
axisbind=SUPER+SHIFT,UP,focusdir,left
axisbind=SUPER+SHIFT,DOWN,focusdir,right

# ── system ──
# logind's Lock signal → the one locker (idle.sh's swayidle handles it).
bind=SUPER,Escape,spawn,loginctl lock-session
# Rescue, works ON the lock screen: swaps a broken Quickshell lock for swaylock.
bindl=SUPER+ALT,Escape,spawn,~/.dotfiles/scripts/sanctuary/lock.sh rescue
bind=SUPER+SHIFT,Escape,spawn,~/.dotfiles/scripts/sanctuary/power.sh open
# Emergency exit if the power menu won't open. Stops the session target first.
bind=SUPER+CTRL+SHIFT,q,spawn,~/.dotfiles/scripts/sanctuary/wm.sh quit
