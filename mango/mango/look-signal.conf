# ── Look · SIGNAL ─────────────────────────────────────────────────────
# config.conf sources `look.conf`, a symlink to the active style's file —
# same idea as niri/niri/layout.kdl → layout-<style>.kdl. Only Signal exists
# so far; a style without its own file looks like Signal (shell.sh).
#
# Signal: square, tight, a 2px border with the focused window in the trace
# green. Colours are 0xRRGGBBAA (the last two digits = opacity; ff = solid).
# Palette: Catppuccin Mocha, as in quickshell/sanctuary/Theme.qml.

# ── borders + gaps (niri: border{} + gaps + struts) ──
border_px=2                      # a hair heavier than the bar's 1px rules
focus_color=0xa6e3a1ff           # focused — green, Signal's trace colour (sigHot)
border_color=0x313244ff          # unfocused — surface0, same as the bar's rules
urgent_color=0xf38ba8ff          # wants attention — red (sigAlarm)
maximized_screen_color=0xa6e3a1ff
scratchpad_color=0x89b4faff      # blue
global_color=0xcba6f7ff          # mauve: a window pinned to every tag
overlay_color=0x94e2d5ff         # teal: always-on-top
drop_color=0xa6e3a144            # drag-to-tile preview, faint green

gap_inner_horizontal=6           # between windows (niri: gaps 6)
gap_inner_vertical=6
gap_outer_horizontal=8           # screen edges, left/right (niri: struts 8)
gap_outer_vertical=6             # top/bottom: niri had top 4, bottom 8 — Mango has one value for both
smart_gaps=0
no_border_when_single=0

# ── shape ──
border_radius=0                  # square (niri Signal: geometry-corner-radius 0)
no_radius_when_single=0
focused_opacity=1.0
unfocused_opacity=1.0
dim_enable=0

# ── background behind everything (no wallpaper yet / overview) ──
root_color=0x1e1e2eff            # base

# ── blur (niri: effects.kdl) — windows only, never the shell ──
# Only visible behind windows that are themselves see-through (kitty).
blur=1
blur_layer=0                     # bar/launcher/centre stay solid islands
blur_optimized=1                 # caches the wallpaper blur — keep on, big GPU saving
blur_params_num_passes=2         # niri: passes 2
blur_params_radius=3             # niri: offset 3.0
blur_params_noise=0.03           # niri: noise 0.03
blur_params_saturation=1.3       # niri: saturation 1.3
blur_params_brightness=1.0       # Mango defaults to 0.9 (darkens); niri doesn't
blur_params_contrast=1.0

# ── shadows: off, as on niri ──
shadows=0
layer_shadows=0

# ── animations ──
# Signal is an instrument: things move quickly and settle, no bounce.
animations=1
layer_animations=1
animation_type_open=zoom         # grow in from slightly smaller (niri's default feel)
animation_type_close=zoom
animation_fade_in=1
animation_fade_out=1
zoom_initial_ratio=0.85          # start at 85% size — subtle, not a pop
zoom_end_ratio=0.85
fade_in_begin_opacity=0.0
fade_out_begin_opacity=1.0
# Tags switch VERTICALLY, like niri's workspaces (1 = horizontal).
tag_animation_direction=0
animation_duration_open=220
animation_duration_close=180
animation_duration_move=250
animation_duration_tag=280
animation_duration_focus=0
# One ease-out curve for everything (cubic-bezier x1,y1,x2,y2).
animation_curve_open=0.22,1,0.36,1
animation_curve_close=0.22,1,0.36,1
animation_curve_move=0.22,1,0.36,1
animation_curve_tag=0.22,1,0.36,1
animation_curve_focus=0.22,1,0.36,1
animation_curve_opacity_fade_in=0.22,1,0.36,1
animation_curve_opacity_fade_out=0.22,1,0.36,1

# ── tab bars (monocle/deck stack windows as tabs) — Signal colours ──
tab_bar_height=26
tab_bar_decorate_bg_color=0x181825ff          # mantle
tab_bar_decorate_fg_color=0x6c7086ff          # overlay0 (sigLabel)
tab_bar_decorate_focus_bg_color=0x11111bff    # crust
tab_bar_decorate_focus_fg_color=0xa6e3a1ff    # green
tab_bar_decorate_border_color=0x313244ff      # surface0
tab_bar_decorate_border_width=1
tab_bar_decorate_corner_radius=0
tab_bar_decorate_font_desc=JetBrainsMono Nerd Font Bold 10

group_bar_height=26
group_bar_decorate_bg_color=0x181825ff
group_bar_decorate_fg_color=0x6c7086ff
group_bar_decorate_focus_bg_color=0x11111bff
group_bar_decorate_focus_fg_color=0xa6e3a1ff
group_bar_decorate_border_color=0x313244ff
group_bar_decorate_border_width=1
group_bar_decorate_corner_radius=0
group_bar_decorate_font_desc=JetBrainsMono Nerd Font Bold 10
group_bar_button_color=0xf38ba8ff

# ── overview (all windows at once) ──
overview_gap_inner=6
overview_gap_outer=12
jump_label_decorate_bg_color=0x11111bff
jump_label_decorate_fg_color=0xcdd6f4ff
jump_label_decorate_focus_bg_color=0xa6e3a1ff
jump_label_decorate_focus_fg_color=0x11111bff
jump_label_decorate_border_color=0x313244ff
jump_label_decorate_border_width=1
jump_label_decorate_corner_radius=0
jump_label_decorate_font_desc=JetBrainsMono Nerd Font Bold 14
