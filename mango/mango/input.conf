# ── Input + focus ─────────────────────────────────────────────────────
# From niri/niri/input.kdl.

# keyboard
xkb_rules_layout=us
repeat_delay=250
repeat_rate=35
numlock_on=0

# mouse (re-login to apply). -1.0 slowest … 1.0 fastest; 2 = adaptive accel,
# so small moves stay precise and quick flicks travel further — same as niri.
mouse_accel_profile=2
mouse_accel_speed=-0.2
mouse_natural_scrolling=0

# Focus follows the mouse (niri: focus-follows-mouse).
sloppy_focus=1
# …but a window poking in from the edge of the scroller strip does NOT steal
# focus on hover. That's niri's max-scroll-amount="0%": hovering never
# scrolls the strip.
edge_scroller_pointer_focus=0
# Keyboard focus changes leave the cursor where it is (niri doesn't warp).
warp_cursor=0

# Cursor: hide after 5 s still (niri: hide-after-inactive-ms 5000).
cursor_theme=Bibata-Modern-Classic
cursor_size=24
cursor_hide_timeout=5

# No hot corner (niri: hot-corners off).
enable_hotarea=0
