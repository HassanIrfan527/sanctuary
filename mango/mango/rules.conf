# ── Window rules ──────────────────────────────────────────────────────
# window_rule=<what to do>,app_id:<regex>[,title:<regex>]
# Both app_id and title given ⇒ both must match. width/height: below 1 is a
# fraction of the screen, above is pixels (floating windows only).
# From niri/niri/window-rules.kdl.

# Small utilities float.
window_rule=is_floating:1,app_id:^(org\.gnome\.Calculator|org\.gnome\.Calendar|org\.gnome\.Weather|pavucontrol|nm-connection-editor)$
window_rule=is_floating:1,width:700,height:700,app_id:^keysound-launcher$

# Brave opens full width in the scroller (niri: open-maximized = full-width column).
window_rule=scroller_proportion:1.0,title:Brave

window_rule=is_floating:1,title:^Picture-in-Picture$
window_rule=is_floating:1,title:^(Open File|Save As|Open Folder)

# The sanctuary's floating terminals — every "panel" is a kitty with a class.
window_rule=is_floating:1,width:900,height:620,app_id:^sanctuary-mixer$
window_rule=is_floating:1,width:1100,height:700,app_id:^sanctuary-btop$
window_rule=is_floating:1,width:1100,height:760,app_id:^sanctuary-wallpaper$
window_rule=is_floating:1,width:900,height:600,app_id:^sanctuary-run$
window_rule=is_floating:1,width:820,height:520,app_id:^sanctuary-clipboard$
window_rule=is_floating:1,width:900,height:600,app_id:^sanctuary-music$
window_rule=is_floating:1,width:560,height:220,app_id:^sanctuary-power$

# ── Layer rules ───────────────────────────────────────────────────────
# Layer surfaces = shell pieces drawn above/below windows (bar, launcher,
# toasts, wallpaper). Quickshell names them sanctuary-*.
#
# Nothing of the shell is blurred: the bar, launcher and centre are solid
# islands on purpose (DESIGN-BRIEF.md §3). The bar, lock preview and the
# capture overlay never animate —
# they should simply BE there.
layer_rule=no_blur:1,no_shadow:1,layer_name:^sanctuary-
layer_rule=no_animation:1,layer_name:^sanctuary-(bar|lock-preview|capture)$
# slurp's selection overlay: no animation or blur, or it ghosts into screenshots.
layer_rule=no_animation:1,no_blur:1,layer_name:^selection$
