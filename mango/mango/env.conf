# ── Environment ───────────────────────────────────────────────────────
# Variables every app started by Mango inherits. Carried over from
# niri/niri/environment.kdl. Note: Mango RE-APPLIES these on every config
# reload, so don't put anything here that a script changes at runtime.
#
# XDG_CURRENT_DESKTOP is not set here: SDDM sets it from mango.desktop's
# DesktopNames ("mango:wlroots"), and portals pick their backend from it.

env=QT_QPA_PLATFORM,wayland;xcb
env=QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env=QT_AUTO_SCREEN_SCALE_FACTOR,1
# Qt apps (qBittorrent etc.) take their style/colours/icons from qt6ct.
# Quickshell is exempted in scripts/sanctuary/qs.sh so the bar is untouched.
env=QT_QPA_PLATFORMTHEME,qt6ct
env=GDK_BACKEND,wayland,x11,*
env=MOZ_ENABLE_WAYLAND,1
env=ELECTRON_OZONE_PLATFORM_HINT,auto
env=XCURSOR_THEME,Bibata-Modern-Classic
env=XCURSOR_SIZE,24

env=TERMINAL,kitty
env=BROWSER,brave-browser
# i5-6500 (Skylake): intel-media-driver (iHD) handles VA-API video decode.
env=LIBVA_DRIVER_NAME,iHD
