# ── Mango · sanctuary ─────────────────────────────────────────────────
# The entry point. Mango reads ~/.config/mango/config.conf (a symlink into
# ~/.dotfiles/mango/mango, see install.sh) and pulls the rest in with `source`.
# Same split as niri/niri/: one file per concern, so each stays readable.
#
# Format: every line is `key=value`, or a command (`bind=`, `exec_once=`,
# `window_rule=`, `tag_rule=` …). `#` starts a comment.
#
# Reloads: auto_reload_config (default 1) watches this file and every sourced
# file — save and it applies. Mouse/trackpad settings need a re-login.
# Check without starting Mango:  mango -c ~/.config/mango/config.conf -p

source=./env.conf        # environment variables for apps
source=./input.conf      # keyboard, mouse, focus behaviour
source=./startup.conf    # session plumbing + what runs at login
source=./layout.conf     # tags, scroller, the other layouts
source=./rules.conf      # window + layer rules
source=./look.conf       # symlink → look-<style>.conf (borders, gaps, colours, blur, animations)
source=./binds.conf      # keybinds (temporary survival set — the real one is still to be talked through)

# ── misc ──
# Xwayland: start when an X11 app needs it, stop when the last one closes.
# Mango's default (1) keeps it alive forever after the first X11 app; this
# matches niri's on-demand xwayland-satellite (~30 MB back when idle).
xwayland_persistence=0
