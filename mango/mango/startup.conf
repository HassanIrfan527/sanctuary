# ── Startup ───────────────────────────────────────────────────────────
# exec_once = run once when Mango starts (niri: spawn-at-startup).
# exec      = run on every config reload — not used here on purpose.
#
# Order matters for the first line only: the session plumbing has to happen
# before anything that needs systemd/D-Bus to know about this display.

# Session plumbing: what `niri-session` did for niri. See the script's header.
exec_once=~/.dotfiles/scripts/sanctuary/mango-session.sh start

# The shell: Quickshell (bar, launcher, toasts, notification centre), in the
# saved style. Falls back to waybar + swaync if it won't come up (shell.sh).
exec_once=~/.dotfiles/scripts/sanctuary/shell.sh start

exec_once=~/.dotfiles/scripts/sanctuary/wallpaper.sh restore
exec_once=~/.dotfiles/scripts/sanctuary/nightlight.sh start
exec_once=~/.dotfiles/scripts/sanctuary/idle.sh
exec_once=bash ~/.dotfiles/scripts/keysounds.sh toggle

# Bluetooth starts OFF every login. Turn it on from the launcher: :DESK → Bluetooth.
exec_once=bluetoothctl power off

# Clipboard history: every copy goes into cliphist, which Mod+V reads.
exec_once=wl-paste --type text --watch cliphist store
exec_once=wl-paste --type image --watch cliphist store
