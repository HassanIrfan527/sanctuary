# ── Tags + layouts ────────────────────────────────────────────────────
# Mango has TAGS, not workspaces. A window carries one or more tags; you view
# one tag (or several at once). Each tag keeps its OWN layout, so tag 3 can be
# a grid while tag 1 scrolls. Layouts: scroller tile grid monocle deck
# center_tile right_tile dwindle fair + vertical_* versions.

tag_num=9
# Occupied tags keep their numbers (no compacting 1,3,9 → 1,2,3).
tag_gather=0

# Every tag starts as a scroller — the niri feel. Switch any one tag live
# with `setlayout` / `switch_layout` (binds to come).
tag_rule=id:*,layout_name:scroller

# What `switch_layout` cycles through, in order.
circle_layout=scroller,tile,grid,monocle,deck

# ── Scroller (niri: layout { … } in layout.kdl) ──
# New windows open at half the screen; the resize bind cycles ⅓ → ½ → ⅔.
# (niri: default-column-width 0.5 + preset-column-widths.)
scroller_default_proportion=0.5
scroller_proportion_preset=0.33333,0.5,0.66667

# niri: center-focused-column "never" — the strip only moves enough to bring
# the focused window into view. These three rank overspread > focus_center >
# prefer_center, so all three go to 0.
scroller_prefer_overspread=0
scroller_focus_center=0
scroller_prefer_center=0

# A lone window behaves like any other, as on niri: it opens at the default
# ½ and SUPER+R / resize change it. With ignore=0 Mango would instead pin a
# lone window to the "single" proportion below and refuse every resize until
# a second window opened (set_proportion returns early — src/dispatch/bind.c).
# The single value is kept only so flipping back is one edit.
scroller_ignore_proportion_single=1
scroller_default_proportion_single=0.5

# Room kept at the screen edges when a window is at proportion 1.0.
scroller_structs=8

# ── Tile / center_tile (master + stack) ──
new_is_master=0               # new windows join the stack, the master stays put
default_master_factor=0.55
default_master_count=1

# ── Monocle / deck: stacked windows become tabs ──
monocle_tab_mode=1
deck_tab_mode=1

# ── Dwindle ──
dwindle_split_ratio=0.5
