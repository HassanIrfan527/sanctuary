# ── mako: minimal sys24 notifications · cozy-white (Gruvbox Light) ──

font=DM Mono 11
background-color=#fbf1c7f2
text-color=#3c3836
border-color=#d65d0e
border-size=1
border-radius=12

width=340
height=140
margin=12,12,0,0
padding=12,16
default-timeout=5000
ignore-timeout=1

anchor=top-right
layer=overlay
max-visible=4
max-icon-size=32
icon-location=left

format=<b>%s</b>\n%b
markup=1

[urgency=low]
border-color=#a89984
default-timeout=3000

[urgency=normal]
border-color=#d65d0e

[urgency=critical]
border-color=#cc241d
default-timeout=0

[mode=do-not-disturb]
invisible=1
