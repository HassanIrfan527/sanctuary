# ── mako: minimal sys24 notifications ──

font=DM Mono 11
background-color=#131315e6
text-color=#e5e2e3
border-color=#929092
border-size=1
border-radius=12

width=340
height=140
margin=12,12,0,0
padding=12,16
default-timeout=5000
ignore-timeout=1

anchor=top-right
layer=overlay
max-visible=4
max-icon-size=32
icon-location=left

format=<b>%s</b>\n%b
markup=1

[urgency=low]
border-color=#5a585a
default-timeout=3000

[urgency=normal]
border-color=#929092

[urgency=critical]
border-color=#e5e2e3
default-timeout=0

[mode=do-not-disturb]
invisible=1
