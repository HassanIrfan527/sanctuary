[ids]
*

[main]
# CapsLock: hold = Super (Meta), tap = Esc.
# Hold + <key> == Super + <key> → all Hyprland shortcuts (single source of
# truth in ~/.config/hypr/keybinds.conf). Tap = Esc, which also exits NAVIGATION.
capslock = overload(meta, esc)

[meta]
# Super + Q  →  enter NAVIGATION mode (vim-style cursor layer).
# togglem also emits F24 so the compositor can light the bottom-bar mode pill.
q = togglem(navigation, f24)

[meta+alt]
# Super + Alt + G  →  toggle ARROWS mode (ijkl → arrow keys).
# Press again to leave. Emits F23 so the bottom-bar pill flips in lockstep.
g = togglem(arrows, f23)

[arrows]
# ARROWS mode — ijkl drive the arrow keys in ANY app (global while active).
# i = up, j = left, k = down, l = right. Unlisted keys still type normally.
# Exit by pressing Super + Alt + G again (toggles the same layer back off).
i = up
j = left
k = down
l = right

[navigation]
# NAVIGATION mode — a vim-normal cursor layer that works in ANY app.
# It is GLOBAL while active, so it WILL fight nvim/tmux insert — that's by
# design: when you're in those, just stay in PASSTHROUGH and never enter here.
# Exit with a single CapsLock tap (= Esc). Holding CapsLock still = Super, so
# window/workspace navigation stays available even inside NAVIGATION.
# Unlisted keys still type — this is a movement layer, not a full vim emulation.

# movement
h = left
j = down
k = up
l = right

# word jumps
w = C-right
b = C-left
e = C-right

# line start / forward-delete
0 = home
x = delete

# exit: CapsLock tap = Esc + leave NAVIGATION. Same F24 phantom as enter, so
# the pill always flips in lockstep with the layer (no on/off desync).
capslock = overload(meta, togglem(navigation, macro(esc f24)))
