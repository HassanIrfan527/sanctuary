source = ~/.config/hypr/hyprlock-colors.conf

general {
    hide_cursor = true
    grace = 0
    no_fade_in = true
    no_fade_out = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.03
    contrast = 0.85
    brightness = 0.30
    vibrancy = 0.15
}

# faint kanji watermark — same motif as zen mode
label {
    monitor =
    text = cmd[update:0] ~/.config/hypr/scripts/zen-kanji.sh
    color = rgba(b4befe1c)
    font_size = 340
    font_family = Maple Mono NF Bold

    position = 0, 30
    halign = center
    valign = center
}

# time-aware greeting
label {
    monitor =
    text = cmd[update:60000] ~/.config/hypr/scripts/lock-greeting.sh
    color = $subtext_color
    font_size = 16
    font_family = Maple Mono NF

    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME12
    color = $text_color
    font_size = 100
    font_family = Maple Mono NF Bold

    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $subtext_color
    font_size = 15
    font_family = Maple Mono NF

    position = 0, 20
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 340, 50
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.35
    dots_center = true
    outer_color = $accent_color
    inner_color = $entry_background_color
    font_color = $text_color
    check_color = $accent_color
    fail_color = $urgent_color
    fade_on_empty = false
    placeholder_text = <span foreground="##6c7086">enter to unlock</span>
    rounding = 14
    hide_input = false

    position = 0, -70
    halign = center
    valign = center
}

label {
    monitor =
    text =   $USER  ·  $LAYOUT
    color = $overlay_color
    font_size = 11
    font_family = Maple Mono NF

    position = 0, -150
    halign = center
    valign = center
}
