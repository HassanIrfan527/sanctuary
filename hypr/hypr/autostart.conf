# Portal & authentication
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = /usr/libexec/polkit-gnome-authentication-agent-1

# Bar & notifications
exec-once = waybar
exec-once = swaync

# Night light
exec-once = hyprsunset -t 3800

# Core services
exec-once = swww-daemon
exec-once = hypridle

# Launcher backend + service
exec-once = systemctl --user start elephant.service
exec-once = walker --gapplication-service

# Keyring
exec-once = gnome-keyring-daemon --start --components=secrets

# GTK / icons / cursor — catppuccin mocha lavender
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'catppuccin-mocha-lavender-standard+default'
exec-once = gsettings set org.gnome.desktop.interface icon-theme 'Papirus-Dark'
exec-once = gsettings set org.gnome.desktop.interface cursor-theme 'catppuccin-mocha-dark-cursors'
exec-once = gsettings set org.gnome.desktop.interface cursor-size 24
exec-once = hyprctl setcursor catppuccin-mocha-dark-cursors 24

# Key sounds
exec-once = ~/.config/hypr/scripts/keysounds-daemon.sh
