$mod = SUPER

#! Apps & Windows
##! Launch Apps
bind = $mod, RETURN, exec, kitty # Terminal
bind = $mod, E, exec, nautilus # File manager
bind = $mod, Y, exec, kitty -e yazi # Yazi file manager
bind = $mod, B, exec, brave-browser # Browser
bind = $mod, O, exec, ~/.config/hypr/scripts/toggle-bottom-bar.sh
bind = $mod, Z, exec, flatpak run app.zen_browser.zen # Zen browser
bind = $mod, A, exec, ~/.config/hypr/scripts/affirmation.sh # Affirmation drawer
bind = $mod ALT, A, exec, ~/.config/hypr/scripts/ambient.sh # Ambient soundscapes
bind = $mod, period, exec, ~/.config/hypr/scripts/recall.sh # Japanese recall drawer
bind = $mod SHIFT, C, exec, ~/.config/hypr/scripts/color-picker.sh # Color picker (hex to clipboard)
bind = $mod, SPACE, exec, walker
bind = $mod, SLASH, exec, ~/.config/hypr/scripts/cheatsheet.sh
bind = $mod SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper-picker.sh
bind = $mod ALT, Z, exec, ~/.config/hypr/scripts/zen-mode.sh

##! Window Management
bind = $mod, W, killactive,
bind = $mod, F, fullscreen, 1
bind = $mod SHIFT, F, fullscreen, 0
bind = $mod, V, exec, walker --provider clipboard
bind = $mod SHIFT, V, togglefloating,
bind = $mod, S, layoutmsg, togglesplit
bind = $mod, G, togglegroup
bind = $mod SHIFT, G, lockactivegroup, toggle
bind = $mod, TAB, changegroupactive, f
bind = $mod SHIFT, TAB, changegroupactive, b
bind = $mod, D, togglespecialworkspace, scratchterm
bind = $mod ALT, D, exec, [workspace special:scratchterm] kitty --class scratchterm
bind = $mod ALT, C, centerwindow
bind = $mod CTRL, H, swapwindow, l
bind = $mod CTRL, J, swapwindow, d
bind = $mod CTRL, K, swapwindow, u
bind = $mod CTRL, L, swapwindow, r

##! Focus
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r
bind = $mod, SEMICOLON, exec, ~/.config/hypr/scripts/window-jump.sh
bind = $mod, left, movefocus, l
bind = $mod, down, movefocus, d
bind = $mod, up, movefocus, u
bind = $mod, right, movefocus, r

#! Move & Resize
##! Move Windows
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r
bind = $mod SHIFT, left, movewindow, l
bind = $mod SHIFT, down, movewindow, d
bind = $mod SHIFT, up, movewindow, u
bind = $mod SHIFT, right, movewindow, r

##! Resize
bind = $mod ALT, H, resizeactive, -40 0
bind = $mod ALT, J, resizeactive, 0 40
bind = $mod ALT, K, resizeactive, 0 -40
bind = $mod ALT, L, resizeactive, 40 0
bind = $mod SHIFT, Z, exec , ~/.dotfiles/scripts/journal.py

##! Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, KP_End, workspace, 1 # [hidden]
bind = $mod, KP_Down, workspace, 2 # [hidden]
bind = $mod, KP_Next, workspace, 3 # [hidden]
bind = $mod, KP_Left, workspace, 4 # [hidden]
bind = $mod, KP_Begin, workspace, 5 # [hidden]
bind = $mod, KP_Right, workspace, 6 # [hidden]
bind = $mod, KP_Home, workspace, 7 # [hidden]
bind = $mod, KP_Up, workspace, 8 # [hidden]
bind = $mod, KP_Prior, workspace, 9 # [hidden]
bind = $mod, P, workspace, e-1 # Workspace: focus left
bind = $mod, N, workspace, e+1 # Workspace: focus right
bind = $mod, C, workspace, empty # New empty workspace (keyd: CapsLock+c)
bind = $mod, apostrophe, workspace, previous # Last workspace toggle (keyd: CapsLock+')

#! Move to WS & System
##! Move to Workspace
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, KP_End, movetoworkspace, 1 # [hidden]
bind = $mod SHIFT, KP_Down, movetoworkspace, 2 # [hidden]
bind = $mod SHIFT, KP_Next, movetoworkspace, 3 # [hidden]
bind = $mod SHIFT, KP_Left, movetoworkspace, 4 # [hidden]
bind = $mod SHIFT, KP_Begin, movetoworkspace, 5 # [hidden]
bind = $mod SHIFT, KP_Right, movetoworkspace, 6 # [hidden]
bind = $mod SHIFT, KP_Home, movetoworkspace, 7 # [hidden]
bind = $mod SHIFT, KP_Up, movetoworkspace, 8 # [hidden]
bind = $mod SHIFT, KP_Prior, movetoworkspace, 9 # [hidden]
bind = $mod SHIFT, P, movetoworkspace, e-1 # Window: move to left workspace
bind = $mod SHIFT, N, movetoworkspace, e+1 # Window: move to right workspace

##! System
bind = $mod, ESCAPE, exec, hyprlock
bind = $mod SHIFT, ESCAPE, exec, busctl --system call org.freedesktop.DisplayManager /org/freedesktop/DisplayManager/Seat0 org.freedesktop.DisplayManager.Seat SwitchToGreeter
bind = $mod, DELETE, exec, walker --provider menus:commands
bind = $mod, M, exec, ~/.config/hypr/scripts/caffeine.sh # Caffeine: keep screen awake

##! keyd NAVIGATION mode (F24 phantom from keyd — flips the bottom-bar pill)
bind = , F24, exec, ~/.config/hypr/scripts/keyd-mode.sh toggle # [hidden]
bind = SUPER, F24, exec, ~/.config/hypr/scripts/keyd-mode.sh toggle # [hidden]

##! Screenshots
bind = , Print, exec, ~/.config/hypr/scripts/screenshot.sh area
bind = SHIFT, Print, exec, ~/.config/hypr/scripts/screenshot.sh edit
bind = $mod, Print, exec, ~/.config/hypr/scripts/screenshot.sh screen

##! Media & Volume
bind = $mod SHIFT, A, exec, kitty --class=wiremix --title=wiremix -e wiremix # Audio mixer (per-app volume/routing)
bind = $mod SHIFT, M, exec, playerctl play-pause # Play/Pause
bind = $mod SHIFT, bracketright, exec, playerctl next # Next track
bind = $mod SHIFT, bracketleft, exec, playerctl previous # Previous track
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise # [hidden]
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower # [hidden]
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle # [hidden]
bindel = $mod, equal, exec, swayosd-client --output-volume raise # Volume up
bindel = $mod, minus, exec, swayosd-client --output-volume lower # Volume down
bindl = $mod, 0, exec, swayosd-client --output-volume mute-toggle # Mute toggle
bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise # [hidden]
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower # [hidden]

##! Key Sounds
bind = $mod SHIFT, B, exec, ~/.config/hypr/scripts/toggle-keysounds.sh
bind = $mod ALT, B, exec, ~/.config/hypr/scripts/switch-keysound-theme.sh

##! Bug Capture
bind = $mod, I, exec, ~/.config/hypr/scripts/bug-capture.sh
bind = $mod SHIFT, I, exec, kitty --class=bug-browse --title=bugs -e zsh -i -c 'cd "$BUG_DIR" && nvim "$(ls -t *.md 2>/dev/null | fzf)"'

##! Study
bind = $mod SHIFT, T, exec, kitty --class=study-today --title=study -e ~/.config/hypr/scripts/study/study-today.sh
bind = $mod ALT, S, exec, ~/.config/hypr/scripts/study/study-mode.sh toggle
bind = $mod ALT, P, exec, ~/.config/hypr/scripts/study/study-pomodoro.sh

##! Night Light & Mouse
bind = $mod SHIFT, EQUAL, exec, pkill hyprsunset; hyprsunset -t 3500 &
bind = $mod SHIFT, MINUS, exec, pkill hyprsunset; hyprsunset -t 4500 &
bind = $mod SHIFT, 0, exec, pkill hyprsunset; hyprsunset -t 3800 &
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

bind = $mod, R, submap, resize
submap = resize
binde = , H, resizeactive, -40 0
binde = , J, resizeactive, 0 40
binde = , K, resizeactive, 0 -40
binde = , L, resizeactive, 40 0
binde = , left, resizeactive, -40 0
binde = , down, resizeactive, 0 40
binde = , up, resizeactive, 0 -40
binde = , right, resizeactive, 40 0
bind = , ESCAPE, submap, reset
bind = , RETURN, submap, reset
submap = reset
