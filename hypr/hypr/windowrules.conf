# Float specific apps
windowrule = match:class ^(org.gnome.Calculator)$, float on
windowrule = match:class ^(org.gnome.Calendar)$, float on
windowrule = match:class ^(org.gnome.Weather)$, float on
windowrule = match:class ^(pavucontrol)$, float on
windowrule = match:class ^(nm-connection-editor)$, float on
windowrule = match:class ^(org.gnome.Nautilus)$, match:title ^(Properties)$, float on

# Calendar popup positioning
windowrule = match:class ^(org.gnome.Calendar)$, size 400 500
windowrule = match:class ^(org.gnome.Calendar)$, move 100%-410 40

# Picture-in-picture
windowrule = match:title ^(Picture-in-Picture)$, float on
windowrule = match:title ^(Picture-in-Picture)$, pin on
windowrule = match:title ^(Picture-in-Picture)$, size 360 200
windowrule = match:title ^(Picture-in-Picture)$, move 100%-370 100%-210

# File dialogs float and center
windowrule = match:title ^(Open File)(.*)$, float on
windowrule = match:title ^(Open File)(.*)$, center on
windowrule = match:title ^(Save As)(.*)$, float on
windowrule = match:title ^(Save As)(.*)$, center on
windowrule = match:title ^(Open Folder)(.*)$, float on
windowrule = match:title ^(Open Folder)(.*)$, center on

# Affirmation drawer (left-docked, cozy floating panel)
windowrule = match:class ^(affirm-drawer)$, float on
windowrule = match:class ^(affirm-drawer)$, size 560 720
windowrule = match:class ^(affirm-drawer)$, move 28 180
windowrule = match:class ^(affirm-drawer)$, opacity 0.95
windowrule = match:class ^(affirm-drawer)$, animation slide

# Audio mixer drawer (centered floating panel)
windowrule = match:class ^(wiremix)$, float on
windowrule = match:class ^(wiremix)$, size 960 600
windowrule = match:class ^(wiremix)$, center 1
windowrule = match:class ^(wiremix)$, opacity 0.95
windowrule = match:class ^(wiremix)$, animation popin

# Wi-Fi picker drawer (centered floating panel)
windowrule = match:class ^(impala-wifi)$, float on
windowrule = match:class ^(impala-wifi)$, size 720 560
windowrule = match:class ^(impala-wifi)$, center 1
windowrule = match:class ^(impala-wifi)$, opacity 0.95
windowrule = match:class ^(impala-wifi)$, animation popin

# Wallpaper picker (centered floating panel, fzf + icat thumbnails)
windowrule = match:class ^(wallpaper-picker)$, float on
windowrule = match:class ^(wallpaper-picker)$, size 1100 640
windowrule = match:class ^(wallpaper-picker)$, center 1
windowrule = match:class ^(wallpaper-picker)$, opacity 0.97
windowrule = match:class ^(wallpaper-picker)$, animation popin

windowrule = match:class ^(quote-picker)$, float on
windowrule = match:class ^(quote-picker)$, size 1000 620
windowrule = match:class ^(quote-picker)$, center 1
windowrule = match:class ^(quote-picker)$, opacity 0.97
windowrule = match:class ^(quote-picker)$, animation popin

# Scratchpad (quake-style dropdown)
windowrule = match:class ^(scratchterm)$, workspace special:scratchterm
windowrule = match:class ^(scratchterm)$, float on
windowrule = match:class ^(scratchterm)$, size 70% 60%
windowrule = match:class ^(scratchterm)$, center 1
windowrule = match:class ^(scratchterm)$, opacity 0.9

# Terminal & editor transparency
windowrule = match:class ^(kitty)$, opacity 0.85 0.85
windowrule = match:class ^(code-url-handler|code|Code|VSCodium)$, opacity 0.85 0.78

# Games — immediate tearing
windowrule = match:class ^(steam_app_.*)$, immediate on
windowrule = match:class ^(gamescope)$, immediate on

# Waybar — frosted glass so soft pills stay cozy on any wallpaper
layerrule = match:namespace ^(waybar)$, blur on
layerrule = match:namespace ^(waybar)$, ignore_alpha 0.1

# Fuzzel launcher (correct namespace)
layerrule = match:namespace ^(launcher)$, blur on
layerrule = match:namespace ^(launcher)$, ignore_alpha 0.7

# Walker launcher
layerrule = match:namespace ^(walker)$, blur on
layerrule = match:namespace ^(walker)$, ignore_alpha 0.6

# SwayOSD (volume/brightness)
layerrule = match:namespace ^(swayosd)$, blur on
layerrule = match:namespace ^(swayosd)$, ignore_alpha 0.6

# Swaync
layerrule = match:namespace ^(swaync-.*)$, blur on
layerrule = match:namespace ^(swaync-.*)$, ignore_alpha 0.5
